name: Tests
on:
  pull_request:
  push:
    branches: ['main', 'phase*/**']
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reference fixture reproducibility
        run: |
          node tools/make-golden.mjs --out /tmp/golden.json
          cmp test/fixtures/golden/v1.1.json /tmp/golden.json
          node tools/make-golden.mjs --legacy --out /tmp/original.json
          cmp test/fixtures/golden/v1.json /tmp/original.json
      - name: Browser setup
        run: |
          if [ -z "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/browser/
